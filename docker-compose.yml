  #     - backend
  #   networks:
  #     - ai_review_network
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  pgadmin_data:
    driver: local
  llm_models:
    driver: local

networks:
  ai_review_network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-ai-review
